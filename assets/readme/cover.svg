<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">BeatAPI Agent Plugin</title>
  <desc id="desc">Connect Agent hosts to every professional capability</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20a4a4" stroke-opacity=".12"/></pattern>
    <linearGradient id="connector"><stop stop-color="#2563FF"/><stop offset="1" stop-color="#20a4a4"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .small { font-size: 18px; font-weight: 700; } .tiny { font-size: 14px; font-weight: 600; } .symbol { font-size: 34px; font-weight: 800; }
  </style>
  <rect width="1200" height="400" rx="24" fill="#f5f7f8"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)" opacity=".08"/>
  <text x="72" y="72" fill="#2563FF" class="mono small" letter-spacing="2">AGENT ROUTER FOR EVERYTHING</text>
  <text x="72" y="190" fill="#17202a" class="sans" font-size="60" font-weight="800" letter-spacing="-2">BeatAPI Agent Plugin</text>
  <text x="76" y="242" fill="#20a4a4" class="sans" font-size="22" font-weight="600">Connect Agent hosts to every professional capability</text>

  <g transform="translate(792 92)">
  <rect x="0" y="58" width="112" height="112" rx="28" fill="#2563FF" fill-opacity=".16" stroke="#2563FF" stroke-width="3"/>
  <rect x="248" y="58" width="112" height="112" rx="28" fill="#20a4a4" fill-opacity=".16" stroke="#20a4a4" stroke-width="3"/>
  <path d="M112 114C156 72 204 156 248 114" fill="none" stroke="url(#connector)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="180" cy="114" r="12" fill="#17202a"/>
  <text x="56" y="126" text-anchor="middle" fill="#2563FF" class="sans symbol">A</text>
  <text x="304" y="126" text-anchor="middle" fill="#20a4a4" class="sans symbol">B</text>
</g>
